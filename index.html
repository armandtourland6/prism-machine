<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site en pause</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #e5e5e5;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Subtle animated gradient background */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 30% 20%, rgba(80, 80, 120, 0.15) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 80%, rgba(60, 60, 100, 0.1) 0%, transparent 50%);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      max-width: 520px;
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 2rem;
      border: 2px solid #333;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      position: relative;
    }

    .icon::after {
      content: '';
      width: 10px;
      height: 10px;
      background: #666;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
      color: #f5f5f5;
    }

    p {
      font-size: 1rem;
      font-weight: 400;
      color: #888;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 1rem;
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #777;
      letter-spacing: 0.02em;
    }

    .badge span {
      width: 6px;
      height: 6px;
      background: #555;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon"></div>
    <h1>Site en pause</h1>
    <p>Ce site est temporairement en pause.<br>Revenez bientôt.</p>
    <div class="badge">
      <span></span>
      Temporarily paused
    </div>
  </div>
</body>
</html>
